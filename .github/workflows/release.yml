name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.1.0"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to confirm this intentional npm release"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: graphvault_test
          POSTGRES_USER: graphvault
          POSTGRES_PASSWORD: graphvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphvault -d graphvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GRAPHVAULT_POSTGRES_URL: postgresql://graphvault:graphvault@localhost:5432/graphvault_test
    steps:
      - name: Confirm release intent
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: test "$RELEASE_CONFIRMATION" = "PUBLISH"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          check-latest: true
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run benchmark:check
      - run: npm run pack:dry-run
      - run: npm run package:smoke
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
