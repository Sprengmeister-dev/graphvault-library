name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.1.0"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to confirm this intentional npm release"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release intent
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: test "$RELEASE_CONFIRMATION" = "PUBLISH"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          check-latest: true
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run benchmark:check
      - run: npm run pack:dry-run
      - run: npm run package:smoke
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
