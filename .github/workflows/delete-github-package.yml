name: Delete GitHub Packages Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-github-package.yml"

permissions:
  contents: read
  packages: write

jobs:
  delete-package:
    name: Delete misleading npm mirror
    runs-on: ubuntu-latest
    steps:
      - name: Delete package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: graphvault
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error --location \
              --request DELETE \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${PACKAGE_OWNER}/packages/npm/${PACKAGE_NAME}"
          )"

          if [ "$status" = "204" ]; then
            echo "Deleted GitHub Packages mirror ${PACKAGE_OWNER}/${PACKAGE_NAME}."
            exit 0
          fi

          if [ "$status" = "404" ]; then
            echo "GitHub Packages mirror ${PACKAGE_OWNER}/${PACKAGE_NAME} is already absent."
            exit 0
          fi

          echo "Unexpected GitHub API status: ${status}" >&2
          cat "$response_file" >&2
          exit 1
