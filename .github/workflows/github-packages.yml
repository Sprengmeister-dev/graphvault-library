name: GitHub Packages Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/github-packages.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GitHub Packages mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@sprengmeister-dev"
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run benchmark:check
      - run: npm run pack:dry-run
      - name: Prepare GitHub Packages metadata
        id: metadata
        run: |
          node --input-type=module <<'JS'
          import { appendFile, readFile, writeFile } from "node:fs/promises";

          const packageJsonPath = "package.json";
          const packageJson = JSON.parse(await readFile(packageJsonPath, "utf8"));
          const version = packageJson.version;

          packageJson.name = "@sprengmeister-dev/graphvault";
          packageJson.repository = {
            type: "git",
            url: "git+https://github.com/Sprengmeister-dev/graphvault-library.git"
          };
          packageJson.publishConfig = {
            registry: "https://npm.pkg.github.com"
          };

          await writeFile(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `package_version=${version}\n`);
          JS
      - name: Check whether mirror version already exists
        id: mirror
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm view @sprengmeister-dev/graphvault@${{ steps.metadata.outputs.package_version }} version --registry=https://npm.pkg.github.com
      - name: Publish mirror
        if: steps.mirror.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry=https://npm.pkg.github.com --access public
