name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: graphvault_test
          POSTGRES_USER: graphvault
          POSTGRES_PASSWORD: graphvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphvault -d graphvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GRAPHVAULT_POSTGRES_URL: postgresql://graphvault:graphvault@localhost:5432/graphvault_test
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run pack:dry-run
      - run: npm run package:smoke
